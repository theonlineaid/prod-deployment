# Monitoring VM — 4 vCPU / 4 GB RAM / 50 GB SSD
#
# The central monitoring services live here: Prometheus, Grafana,
# blackbox-exporter, Loki. node-exporter/cadvisor/promtail run locally on
# the Infra and App VMs instead (see ../infra-vm/compose.yml and
# ../app-vm/docker-compose.monitoring-agent.yml) — Prometheus below
# scrapes the exporters remotely over the private LAN, while Promtail on
# those VMs pushes logs to Loki (reverse direction from the metrics
# scrape). kafka-exporter is co-located with Kafka on the App VM for the
# same reason as the other exporters.
#
# Firewall: this VM needs OUTBOUND access to the Infra VM (9100, 8080)
# and App VM (9100, 8080, 9308) private IPs, plus outbound internet
# access for blackbox-exporter's public HTTPS probes. It also needs
# INBOUND 3100 (Loki push) from the Infra VM and App VM private IPs only.
# Grafana (3005) and Loki (3100) should both be restricted to admin IPs /
# a VPN / the other VMs — never exposed publicly.
#
# Loki here uses single-binary mode with local filesystem storage (no
# S3/GCS) — fine for this VM's scale; revisit if log volume grows past
# what the 50 GB SSD can hold at the configured retention_period.

networks:
  monitoring-net:
    name: monitoring-net

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prod-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [monitoring-net]

  grafana:
    image: grafana/grafana:latest
    container_name: prod-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3005:3000"
    depends_on:
      - prometheus
    networks: [monitoring-net]

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: prod-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    ports:
      - "9115:9115"
    networks: [monitoring-net]

  loki:
    image: grafana/loki:latest
    container_name: prod-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - "--config.file=/etc/loki/loki.yml"
    ports:
      - "3100:3100"
    networks: [monitoring-net]

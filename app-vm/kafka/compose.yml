# Kafka single broker (KRaft combined mode) — lives on the App VM per the
# "Application + Kafka + NGINX" sizing. Co-located with the apps that
# produce/consume its topics (oms-admin, fix-initiator), so they reach it
# by container name (kafka:9092) on the shared app-net network — no
# cross-VM hop needed for the Kafka traffic path.
#
# kafka-exporter (../monitoring-agent.compose.yml) also lives on this VM
# for the same reason, and is scraped remotely by the Monitoring VM.

networks:
  app-net:
    external: true
    name: app-net

volumes:
  kafka_data:
    name: kafka_data

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: prod-kafka
    restart: unless-stopped

    mem_limit: 4g
    cpus: 3.0

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # ---- Single-node quorum ----
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ---- Topic defaults (replication factor 1 — no other broker to replicate to) ----
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # ---- JVM (sized for the App VM's larger 16 vCPU / 28 GB budget) ----
      KAFKA_HEAP_OPTS: "-Xms2g -Xmx4g"

      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent"

      # ---- Threads ----
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_IO_THREADS: 6
      KAFKA_BACKGROUND_THREADS: 4
      KAFKA_NUM_REPLICA_FETCHERS: 1

      # ---- Retention ----
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 2147483648
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_CLEANER_THREADS: 1
      KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR: 1

      # ---- Performance ----
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks: [app-net]

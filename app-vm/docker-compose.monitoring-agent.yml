# Local monitoring agents for the App VM — scraped remotely by the
# Monitoring VM's Prometheus (see ../monitoring-vm/monitoring/prometheus.yml).
# kafka-exporter lives here (not on the Monitoring VM) because it's
# co-located with Kafka on this VM's app-net network.
#
# alloy pushes this VM's Docker container logs to the Monitoring VM's
# Loki (see monitoring/config.alloy — fill in <MONITORING_VM_PRIVATE_IP>
# there before starting this stack).
#
# Joins app-net (created by kafka/compose.yml or apps/*/compose.yml) —
# bring at least one of those up first.

networks:
  app-net:
    external: true
    name: app-net

volumes:
  alloy_data:

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: prod-app-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    networks: [app-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: prod-app-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8080:8080"
    networks: [app-net]

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: prod-kafka-exporter
    restart: unless-stopped
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "9308:9308"
    networks: [app-net]

  alloy:
    image: grafana/alloy:latest
    container_name: prod-app-alloy
    restart: unless-stopped
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    ports:
      - "12345:12345"
    networks: [app-net]
